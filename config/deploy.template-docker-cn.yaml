Deploy:
  Git:
    # URL of NikkeAutoScript repository
    # [CN user] Use 'https://git.megumiss.top/megumiss/NIKKEAutoScript' for faster and more stable download
    # [Gitee] Use 'https://gitee.com/megumiss/NIKKEAutoScript', may require login
    # [Other] Use 'https://github.com/megumiss/NIKKEAutoScript'
    Repository: https://git.megumiss.top/megumiss/NIKKEAutoScript
    # Branch of NKAS
    # [Developer] Use 'dev', 'app', etc, to try new features
    # [Other] Use 'master', the stable branch
    Branch: master
    # Filepath of git executable `git.exe`
    # [Easy installer] Use './toolkit/Git/mingw64/bin/git.exe'
    # [Other] Use you own git
    GitExecutable: /usr/bin/git
    # Set git proxy
    # [CN user] Use your local http proxy (http://127.0.0.1:{port}) or socks5 proxy (socks5://127.0.0.1:{port})
    # [Other] Use null
    GitProxy: null
    # Set SSL Verify
    # [In most cases] Use true
    # [Other] Use false to when connected to an untrusted network
    SSLVerify: true
    # Update NKAS at startup
    # [In most cases] Use true
    AutoUpdate: true

  Python:
    # Filepath of python executable `python.exe`
    # [Easy installer] Use './toolkit/python.exe'
    # [Other] Use you own python, and 3.9.x 64bit is recommended
    PythonExecutable: /usr/local/bin/python
    # URL of pypi mirror
    # [CN user] Use 'https://mirrors.aliyun.com/pypi/simple' for faster and more stable download
    # [Other] Use null
    PypiMirror: https://mirrors.aliyun.com/pypi/simple
    # Install dependencies at startup
    # [In most cases] Use true
    InstallDependencies: true
    # Path to requirements.txt
    # [In most cases] Use 'requirements.txt'
    # [In Docker] Use './deploy/docker/requirements.txt'
    RequirementsFile: ./deploy/docker/requirements.txt

  Adb:
    # Filepath of ADB executable `adb.exe`
    # [Easy installer] Use './toolkit/Lib/site-packages/adbutils/binaries/adb.exe'
    # [Other] Use you own latest ADB, but not the ADB in your emulator
    AdbExecutable: /usr/bin/adb
    # Whether to replace ADB
    # Chinese emulators (NoxPlayer, LDPlayer, MemuPlayer, MuMuPlayer) use their own ADB, instead of the latest.
    # Different ADB servers will terminate each other at startup, resulting in disconnection.
    # For compatibility, we have to replace them all.
    # This will do:
    #   1. Terminate current ADB server
    #   2. Rename ADB from all emulators to *.bak and replace them by the AdbExecutable set above
    #   3. Brute-force connect to all available emulator instances
    # [In most cases] Use true
    # [In few cases] Use false, if you have other programs using ADB.
    ReplaceAdb: true
    # Brute-force connect to all available emulator instances
    # [In most cases] Use true
    AutoConnect: true
    # Re-install uiautomator2
    # [In most cases] Use true
    InstallUiautomator2: true

  Update:
    # Use auto update and builtin updater feature
    # This may cause problem https://github.com/LmeSzinc/AzurLaneAutoScript/issues/876
    EnableReload: true
    # Check update every X minute
    # [Disable] 0
    # [Default] 5
    CheckUpdateInterval: 5
    # Scheduled restart time
    # If there are updates, NKAS will automatically restart and update at this time every day
    # and run all nkas instances that running before restarted
    # [Disable] null
    # [Default] 03:50
    AutoRestartTime: 03:50
    # Desktop shell update manifest. The desktop version is independent from the project release tag.
    # [Default] Use 'https://nkas.megumiss.top/releases/latest/nkas-desktop.json', hosted on the official VPS (faster for CN users)
    # [Other] Use 'https://github.com/megumiss/NIKKEAutoScript/releases/latest/download/nkas-desktop.json' to update from GitHub Release
    DesktopUpdateManifest: https://nkas.megumiss.top/releases/latest/nkas-desktop.json

  Webui:
    # --host. Host to listen
    # [Use IPv6] '::'
    # [In most cases] Default to '0.0.0.0'
    WebuiHost: 0.0.0.0
    # --port. Port to listen
    # You will be able to access webui via `http://{host}:{port}`
    # [In most cases] Default to 12271
    WebuiPort: 12271
    # Follow system display scaling in the desktop shell
    DpiScaling: true
    # Enable WebView2 GPU acceleration. Restart the desktop shell after changing.
    HardwareAcceleration: false
    # Language to use on web ui
    Language: zh-CN
    # Theme of web ui
    # 'light' for light theme, 'dark' for dark theme
    Theme: light
    # Home page shown when opening the web ui
    # 'overview' for dashboard, 'instance' for the first instance page
    HomePage: overview
    # --run. Auto-run specified config when startup
    Run: null
    # Notice ids marked as read by current user, comma separated
    ReadNoticeIds: null

  Serial:
    # Enable serial execution for multiple instances, works on any platform.
    # Instances in SerialGroup take turns to run tasks; only one instance operates the device at a time.
    # Typical uses:
    # - win platform: parallel instances fight for the global mouse and window focus;
    # - adb platform: stagger instances sharing one emulator or reduce load on weak machines.
    # Instance processes keep running; the turn is passed automatically. Processes must be started as usual (e.g. via Run or start all).
    # [Default] false
    SerialEnable: false
    # Instances to run serially, in execution order (ordered picker on the deploy settings page).
    # Stored as an ordered 'a > b' string; instances not in the list are unaffected and run in parallel as before.
    SerialGroup: null
    # Behavior when an instance stops with an error
    # 'skip': Skip it and continue with the next instance
    # 'stop': Stop granting turns until the next day or a manual reset
    # 'retry': Skip it for now, restart it once when no other instance needs the turn
    # [Default] skip
    SerialOnError: skip
    # Release the turn when the holder's next task is more than X minutes away.
    # High-frequency tasks (e.g. SpecialArenaWatch) get the turn back when they become due.
    # [Default] 5
    SerialIdleThreshold: 5

  Statistics:
    # Report anonymous usage statistics at startup, at most once per day. No account, config or any personal data is collected
    # Reported data: random anonymous ID, source commit hash, OS platform name, screen resolution
    EnableStatistics: true
