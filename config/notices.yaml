- id: notice_20260806
  date: 2026-08-06
  title: 全新版本更新
  type: info
  content: |
    <b>本次完全重写了前端部分，建议重新下载完整包使用</b>
    <a href="https://github.com/megumiss/NIKKEAutoScript/releases/latest" target="_blank">GitHub Releases 下载页</a>

    <b>1. 新下载完整包的用户</b>
    将旧版本目录下的 config 文件夹复制到新版本目录内覆盖，即可导入旧的配置与账号数据。

    <b>2. 新增匿名使用统计</b>
    启动时上报随机匿名 ID、源码Commit号、系统平台名称、屏幕分辨率，每天最多一次，不收集账号、配置等任何个人数据。
    关闭方法：部署页面 → Statistics → EnableStatistics。

    <b>3. 问题反馈</b>
    新版 exe 使用中如遇到问题，欢迎到 <a href="https://github.com/megumiss/NIKKEAutoScript/issues" target="_blank">GitHub Issues</a> 或者 <a href="https://qm.qq.com/q/ibQKuQI9Ko" target="_blank">QQ群</a> 反馈。
