# 公告列表，新的公告追加到文件顶部
- id: notice_20260903
  date: 2026-09-03
  title: 修复后台模式滑动问题
  type: info
  content: |
    <b>后台模式滑动问题已修复</b>
    已修复后台模式下的滑动问题，模拟室超频、商店、珍藏品等已正常
    联动小游戏PC端因为只能用键盘控制，所以在运行时会短暂将游戏拉起到前台
- id: notice_202609012
  date: 2026-09-01
  title: PC 客户端新增「控制方案」选项：支持后台控制
  type: info
  content: |
    <b>PC 客户端现已支持后台控制游戏窗口</b>
    在 PC 客户端设置中新增「控制方案」，可选两种方式：
    - <b>pyautogui（前台模式）</b>：默认方案，模拟物理鼠标输入，点击、滚动和滑动会占用真实鼠标
    - <b>postmessage（后台模式）</b>：点击、滚动、滑动和常规键盘按键通过窗口消息发送，不将游戏窗口前置，不会抢占前台

    <b>使用方法</b>
    1. 进入 NKAS → PC 客户端设置，截图方式选择 PrintWindow，控制方案选择 postmessage；
    2. 操作过程中鼠标光标会短暂移动，属正常现象；
    3. 启动器仍依赖前台操作，不受控制方案影响。

    <b>已知问题</b>
    滑动相关：
    1. 模拟室超频无法重选词条
    2. 所有涉及到滚动的商店都有可能会漏
    3. 派遣珍藏品切换时不能正常选择
    其他：
    1. 部分依赖 DirectInput/Raw Input 的场景可能不响应后台键盘消息，此时仍需使用前台模式
