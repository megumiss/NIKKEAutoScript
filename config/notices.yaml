- id: notice_20260828
  date: 2026-08-28
  title: 1080P 屏幕新方案：VDD 虚拟屏幕
  type: info
  content: |
    <b>1080P 用户不再需要「旋转屏幕」，推荐使用 VDD 虚拟屏幕运行脚本</b>
    通过 Virtual Display Driver 在系统中创建一块 1080x1920 的虚拟屏幕，游戏窗口放在虚拟屏上竖屏运行，主屏完全不受影响，脚本结束后虚拟屏可自动关闭。

    <b>驱动下载</b>
    <a href="https://github.com/VirtualDrivers/Virtual-Display-Driver/releases" target="_blank">Virtual Display Driver GitHub Releases</a>
    建议直接安装：Virtual.Display.Driver-vxx.xx.xx-setup-x64.exe

    <b>使用方法</b>
    1. 安装驱动后，打开系统显示设置，选择出现的新屏幕，将其分辨率设为 1920x1080，竖屏
    2. 进入 NKAS → PC 客户端设置开启「多屏幕模式」，点击「启动虚拟屏幕」，然后在「游戏窗口目标屏幕」中选择虚拟屏幕;
    3. 勾选「是否为VDD虚拟屏幕」和「自动管理VDD屏幕」，任务启动时会自动启用虚拟屏、结束后自动禁用;
    4. 原来为 1080P 开启的「旋转屏幕」可以关闭了。
- id: notice_20260822
  date: 2026-08-22
  title: 调度设置（BETA）
  type: info
  content: |
    <b>新增调度设置页面，集中管理所有任务的执行时间与启用状态</b>
    入口：左侧任务栏 → 调度设置（BETA）。

    <b>功能一览</b>
    统一查看/修改每个任务的执行周期（每日/每周/每月）、执行时间和启用开关；支持勾选多个任务批量设置周期与时间；点击任务名可直接跳转到该任务的设置页。

    <b>使用建议</b>
    每日任务建议保持同一时间：到点后按优先级一次跑完。分散到不同时间会打乱执行顺序，可能导致漏领奖励；需要一天跑多次的任务再单独添加时间。

    <b>注意事项</b>
    该功能处于 BETA 阶段，有问题欢迎到 <a href="https://github.com/megumiss/NIKKEAutoScript/issues" target="_blank">GitHub Issues</a> 反馈。
- id: notice_20260819
  date: 2026-08-19
  title: 妮游社自动登录获取 Cookie
  type: info
  content: |
    <b>妮游社 Cookie 现已支持一键登录自动获取</b>
    无需再手动复制 Cookie：妮游社 → Cookie → 点击「一键登录」，脚本会自动完成登录，并自动填写 Cookie、XCommonParams 和 Cookie 过期时间。

    <b>使用前准备</b>
    在 NKAS 设置-账号设置 中填写 LiPass 账号和密码。

    <b>注意事项</b>
    登录过程中如出现滑块验证码，在弹窗中的图片上拖动完成即可。首次使用会自动安装 playwright，本机没有 Chrome/Edge 时会自动下载 chromium，Docker 环境亦可使用。
- id: notice_20260816
  date: 2026-08-16
  title: 妮游社 Cookie 自动续期
  type: info
  content: |
    <b>妮游社 Cookie 现已支持自动续期</b>
    Cookie 临近过期时任务会自动续期，无需再手动更新 Cookie。

    <b>开启方法</b>
    妮游社 → Cookie → 勾选「自动续期（BETA）」，并在 NKAS 设置-账号设置 中填写 LiPass 账号（只填写账号即可）。

    <b>注意事项</b>
    Cookie 一旦过期将无法续期，请保持任务正常运行。首次续期会自动安装 playwright，Docker 用户还会下载 chromium。
