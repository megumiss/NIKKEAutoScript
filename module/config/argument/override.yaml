# ==================== NKAS ====================

Restart:
  Scheduler:
    Enable:
      value: true
      display: disabled

Notify:
  Scheduler:
    Enable:
      value: true
      display: disabled

# ==================== Reward ====================

Reward:
  Scheduler:
    Enable:
      value: true
      type: lock

# ==================== 周常任务 ====================
# 默认周期 weekly；按周期裁剪任务页字段：显示每周执行日/时间；
# ServerUpdate 用 hide_keep 隐藏但保留用户值（周期被切成 daily 时仍生效）

Synchro:
  Scheduler:
    Cadence: { value: weekly, display: hide_keep }
    ServerUpdate: { display: hide_keep }
    WeeklyDay: { display: show }
    WeeklyTime: { display: show }

Recycling:
  Scheduler:
    Cadence: { value: weekly, display: hide_keep }
