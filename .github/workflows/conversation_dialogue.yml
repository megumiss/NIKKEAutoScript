name: 更新咨询对话

on: 
  schedule:
    - cron:  '0 17 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: master
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
      working-directory: ./dev_tools/
    - name: Run python script
      run: |
        python conversation_dialogue.py
      working-directory: ./dev_tools/
    - name: Commit dialogue.zh-CN.json file if changed
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: 更新咨询对话
        repository: ./module/conversation/
        file_pattern: dialogue.zh-CN.json
