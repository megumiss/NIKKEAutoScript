name: Publish MirrorChyan source

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirrorchyan-source-stable
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    env:
      MIRROR_TOKEN: ${{ secrets.MirrorChyanUploadToken }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify master tip
        id: tip
        run: |
          TIP=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ "$TIP" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded or non-master revision $GITHUB_SHA"
          fi
      - name: Build source ZIP and history
        run: |
          python -m deploy.build_mirror_package source --ref "$GITHUB_SHA" --output dist/NKAS_repo.zip --metadata-dir dist/metadata
          mkdir -p dist/history
          cp dist/metadata/update-history.json "dist/history/$GITHUB_SHA.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NKAS_repo-${{ github.sha }}
          path: dist
      - name: Upload source to MirrorChyan
        if: steps.tip.outputs.publish == 'true' && env.MIRROR_TOKEN != ''
        uses: MirrorChyan/uploading-action@v1
        with:
          filetype: local
          filename: dist/NKAS_repo.zip
          version_name: ${{ github.sha }}
          mirrorchyan_rid: NKAS_repo
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
          auto_channel: 'false'
          channel: stable
      - name: Publish immutable history
        if: steps.tip.outputs.publish == 'true' && env.VPS_HOST != ''
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: dist/history/${{ github.sha }}.json
          target: ${{ secrets.VPS_HISTORY_PATH || '/www/wwwroot/nkas.megumiss.top/releases/history' }}
          strip_components: 2
