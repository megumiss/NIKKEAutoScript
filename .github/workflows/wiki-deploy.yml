name: Deploy Wiki to VPS

# ==============================================================================
# Wiki 文档站发布说明：
#   GitHub wiki 是独立仓库、不能跑 Actions，因此本工作流放在主仓库，
#   在 wiki 编辑（gollum 事件）或 doc/wiki-site 站点壳更新时触发：
#   拉取 wiki 内容（markdown + assets），套入 doc/wiki-site 的 docsify 壳，
#   并将页面间的 GitHub wiki 链接改写为站内路由后，推送到 VPS 站点 /wiki 子路径；
#   也支持 workflow_dispatch 手动触发（用于首次部署或补救发布）。
#   使用增量覆盖方式上传，不会删除 VPS 上的其他文件；
#   wiki 页面改名/删除后需手动清理 VPS 上的旧文件。
# 需要的 secrets（Settings -> Secrets and variables -> Actions）：
#   VPS_HOST / VPS_USERNAME / VPS_SSH_KEY / VPS_PORT（可选，默认 22）
#   VPS_WIKI_DEPLOY_PATH（可选，默认 /www/wwwroot/nkas.megumiss.top/wiki）
# ==============================================================================

on:
  gollum: # wiki 页面编辑
  push:
    branches:
      - master
    paths:
      - 'doc/wiki-site/**' # 站点壳更新
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read

jobs:
  deploy-wiki:
    runs-on: ubuntu-latest

    steps:
      # 主仓库：提供 doc/wiki-site/ 下的 docsify 站点壳
      - name: Checkout main repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          path: main

      # wiki 仓库：文档内容（markdown + assets）
      - name: Checkout wiki repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Build wiki site directory
        run: |
          set -e
          mkdir -p dist/zh-cn dist/en
          cp main/doc/wiki-site/index.html dist/
          cp -r wiki/assets dist/

          # wiki 源文件按语言拆到 zh-cn/ 与 en/ 目录：
          # docsify 会把正文中 #/ 开头的链接误判为页内锚点（且带点号的路由路径有缺陷），
          # 因此站内链接改写为相对链接（同语言 Page.md，跨语言 ../en/Page.md）。
          # 图片 assets/ 路径保持原样：hash 路由下浏览器始终以 /wiki/ 为基准解析，
          # assets/... 正好落在 /wiki/assets/...，加 ../ 反而会跳出 wiki 目录
          WIKI_URL="https://github.com/${GITHUB_REPOSITORY}/wiki"
          for f in wiki/*.md; do
            base=$(basename "$f" .md)
            [ "$base" = "_Sidebar" ] && continue
            if [[ "$base" == *.zh-CN ]]; then
              out="dist/zh-cn/${base%.zh-CN}.md"
              zh_rep='\1.md'; en_rep='../en/\1.md'
            else
              out="dist/en/$base.md"
              zh_rep='../zh-cn/\1.md'; en_rep='\1.md'
            fi
            sed -e "s|$WIKI_URL/\([A-Za-z0-9-]*\)\.zh-CN|$zh_rep|g" \
                -e "s|$WIKI_URL/\([A-Za-z0-9-]*\)|$en_rep|g" \
                "$f" > "$out"
          done

          # _Sidebar.md 含「中文文档」与「English」两个分区，拆成各语言目录自己的 _sidebar.md；
          # 站内版的侧边栏不保留 ## 分区标题与语言行（顶部导航已有语言切换，标题会造成视觉重复），
          # 源文件里的结构保留给 GitHub wiki 页面使用
          sed -n '/^## .*中文文档/,/^## .*English/p' wiki/_Sidebar.md | sed '$d' \
            | grep -v -e '^## ' -e '^\*\*语言\*\*' > dist/zh-cn/_sidebar.md
          sed -n '/^## .*English/,$p' wiki/_Sidebar.md \
            | grep -v -e '^## ' -e '^\*\*Language\*\*' > dist/en/_sidebar.md
          sed -i -e "s|$WIKI_URL/\([A-Za-z0-9-]*\)\.zh-CN|\1.md|g" \
                 -e "s|$WIKI_URL/\([A-Za-z0-9-]*\)|../en/\1.md|g" dist/zh-cn/_sidebar.md
          sed -i -e "s|$WIKI_URL/\([A-Za-z0-9-]*\)\.zh-CN|../zh-cn/\1.md|g" \
                 -e "s|$WIKI_URL/\([A-Za-z0-9-]*\)|\1.md|g" dist/en/_sidebar.md

      - name: Verify wiki files
        run: |
          test -f dist/index.html
          test -f dist/zh-cn/Home.md
          test -f dist/en/Home.md
          test -f dist/zh-cn/_sidebar.md
          test -f dist/en/_sidebar.md
          ls -lh dist dist/zh-cn dist/en
          echo '--- leftover external wiki links ---'
          grep -rn "github.com/${GITHUB_REPOSITORY}/wiki/" dist/zh-cn dist/en || echo 'none'

      - name: Upload wiki to VPS
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634  # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "dist/**"
          target: ${{ secrets.VPS_WIKI_DEPLOY_PATH || '/www/wwwroot/nkas.megumiss.top/wiki' }}
          strip_components: 1
