<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地图标注 · NIKKE</title>
  <link rel="stylesheet" href="/editor.css">
  <script src="/editor.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">N</span><div><h1>地图标注</h1><span>CHAPTER MAP EDITOR</span></div></div>
    <label class="map-picker">地图包<select id="map-select" aria-label="地图包"><option>正在读取地图…</option></select></label>
    <button id="refresh-maps" title="重新扫描目录">刷新目录</button>
    <div class="save-actions"><span id="save-state" class="save-state">未打开地图</span><button id="save" class="primary" disabled>保存 <kbd>Ctrl S</kbd></button></div>
  </header>

  <main class="workspace">
    <aside class="tools-panel" aria-label="绘制工具">
      <div class="section-label">绘制</div>
      <div class="tools" role="group" aria-label="标注类型">
        <button data-tool="select" aria-pressed="true" title="选择对象、拖动对象或顶点 (V)">选择 <kbd>V</kbd></button>
        <button data-tool="pan" aria-pressed="false" title="拖动画布 (H)，也可按住空格拖动">平移 <kbd>H</kbd></button>
        <button data-tool="point" aria-pressed="false" title="单击创建点 (P)">点 <kbd>P</kbd></button>
        <button data-tool="polyline" aria-pressed="false" title="连续单击，双击或 Enter 完成 (L)">折线 <kbd>L</kbd></button>
        <button data-tool="polygon" aria-pressed="false" title="至少三个顶点，双击或 Enter 完成 (G)">多边形 <kbd>G</kbd></button>
        <button data-tool="rectangle" aria-pressed="false" title="按住拖动绘制矩形 (R)">矩形 <kbd>R</kbd></button>
        <button data-tool="connect" aria-pressed="false" title="依次点击两个对象创建连接 (C)">连接 <kbd>C</kbd></button>
      </div>
      <div class="section-label">新标注</div>
      <label>类别 / 标签<input id="new-label" list="label-options" value="路口" maxlength="256"></label>
      <datalist id="label-options"></datalist>
      <label class="color-row">颜色<input id="new-color" type="color" value="#ffb454" aria-label="新标注颜色"></label>
      <label class="check"><input id="new-directed" type="checkbox">新连接为单向</label>
      <div class="section-label">显示</div>
      <label>图层<select id="layer"><option value="map.png">道路底图</option><option value="reference.png">实拍参考图</option></select></label>
      <label class="check"><input id="show-annotations" type="checkbox" checked>显示标注</label>
      <label class="check"><input id="show-labels" type="checkbox" checked>显示标签</label>
      <div class="tool-help"><strong>操作提示</strong><p>滚轮缩放 · 空格拖动平移</p><p>Enter 完成 · Esc 取消</p><p>绘制时 Backspace 撤回顶点</p><p>选中后拖动顶点修正位置</p></div>
    </aside>

    <section class="canvas-panel" aria-label="标注工作区">
      <div class="canvas-toolbar">
        <div class="toolbar-group"><button id="undo" disabled title="撤销 (Ctrl+Z)">撤销</button><button id="redo" disabled title="重做 (Ctrl+Shift+Z)">重做</button></div>
        <div class="toolbar-group"><button id="finish" disabled>完成绘制</button><button id="cancel" disabled>取消</button></div>
        <div class="toolbar-group zoom-tools"><button id="zoom-out" aria-label="缩小">−</button><output id="zoom">100%</output><button id="zoom-in" aria-label="放大">＋</button><button id="actual-size">1:1</button><button id="fit">适应窗口</button></div>
      </div>
      <div id="stage" class="stage">
        <svg id="canvas" xmlns="http://www.w3.org/2000/svg" tabindex="0" aria-label="地图画布，使用左侧工具绘制，滚轮缩放">
          <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6dce5"/></marker></defs>
          <g id="scene"><image id="base-image" x="0" y="0"/><g id="connections"></g><g id="objects"></g><g id="handles"></g><g id="draft"></g></g>
        </svg>
        <div id="empty-state" class="empty-state"><h2>打开一张地图，开始标注</h2><p>从上方选择地图包。使用 --root 可指定其他地图目录。</p></div>
        <div id="drawing-hint" class="drawing-hint" hidden></div>
      </div>
      <footer class="statusbar"><span id="coordinates">X — · Y —</span><span id="dimensions">原图像素坐标</span><span id="map-status"></span></footer>
      <div id="message" role="status" aria-live="polite">标注保存到地图目录中的 annotations.json。</div>
    </section>

    <aside class="inspector" aria-label="标注管理">
      <div class="inspector-heading"><h2>标注对象</h2><span id="object-count" class="badge">0</span></div>
      <input id="search" type="search" placeholder="搜索标签或 ID" aria-label="搜索标注">
      <div id="object-list" class="object-list"><p class="muted empty-list">暂无标注。选择左侧工具在图上绘制。</p></div>
      <div class="properties-heading"><h2>属性</h2><button id="locate" disabled>定位</button></div>
      <p id="no-selection" class="muted">选择图上的标注或列表项目，即可编辑。</p>
      <form id="properties" hidden>
        <div class="object-identity"><span id="selected-type"></span><code id="selected-id"></code></div>
        <label>类别 / 标签<input id="edit-label" list="label-options" maxlength="256"></label>
        <label class="color-row">颜色<input id="edit-color" type="color" aria-label="标注颜色"></label>
        <label>备注<textarea id="edit-note" rows="2" maxlength="4000" placeholder="例如：战斗后开放、需要调查"></textarea></label>
        <div id="connection-properties" hidden><p id="connection-endpoints" class="muted"></p><label class="check"><input id="edit-directed" type="checkbox">单向连接</label></div>
        <div id="vertex-properties"><div class="vertices-heading"><span>顶点坐标</span><button id="add-vertex" type="button">插入顶点</button></div><div id="vertices"></div></div>
        <button id="delete" type="button" class="danger">删除选中标注 <kbd>Del</kbd></button>
      </form>
      <details class="file-details"><summary>文件与副本</summary><p id="package-path" class="muted"></p><button id="download" disabled>下载 JSON 副本</button><button id="reload" disabled>重新加载磁盘标注</button><p class="muted">保存前自动备份原文件；底图保持不变。</p></details>
    </aside>
  </main>
</body>
</html>
